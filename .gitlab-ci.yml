# Updated GitLab CI configuration to use the rocker/verse image
image: rocker/verse:4.3.0

stages:
  - build
  - deploy

variables:
  RENV_PATHS_ROOT: /root/.local/share/renv/

cache:
  paths:
    - /root/.cache/R
    - /root/.local/share/renv

build:
  stage: build
  script:
    # Checkout Lesson (equivalent to actions/checkout@v4)
    - git clone $CI_REPOSITORY_URL

    # # Setup Lesson Engine (equivalent to carpentries/actions/setup-sandpaper@main)
    # - Rscript -e 'install.packages("remotes")'
    # - Rscript -e 'remotes::install_github("carpentries/sandpaper")'

    # # Install the varnish package to resolve the missing dependency
    # - Rscript -e 'remotes::install_github("carpentries/varnish")'

    # # Deploy Site (equivalent to sandpaper:::ci_deploy)
    # - Rscript -e 'sandpaper::package_cache_trigger(TRUE)'
    # # - Rscript -e 'sandpaper:::ci_deploy(reset = FALSE)'
    # - Rscript -e 'sandpaper:::build_lesson(preview = FALSE)'

    - Rscript -e 'install.packages(c("sandpaper", "varnish", "pegboard", "tinkr"), repos = list(carpentries="https://carpentries.r-universe.dev/", CRAN="https://cloud.r-project.org"))'
    # Explicitly reinstall the xml2 package to address potential issues
    - Rscript -e 'install.packages("xml2", repos = "https://cloud.r-project.org")'
    # Add debugging steps to the build stage
    - Rscript -e 'sessionInfo()'  # Print R session information
    - ls -R  # List all files in the workspace
    - echo "Clearing cache..." && rm -rf /root/.cache/R /root/.local/share/renv  # Clear cache
    # - Rscript -e 'sandpaper:::validate_lesson()'
    - Rscript -e 'sandpaper:::build_markdown()'
    - Rscript -e 'sandpaper:::build_lesson(preview = FALSE, quiet = FALSE)'

# Deploy stage to GitLab Pages
deploy:
  stage: deploy
  script:
    - mv site/ public
  artifacts:
    paths:
      - public
  only:
    - main