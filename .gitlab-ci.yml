# Updated GitLab CI configuration to start from an Ubuntu image and replicate all steps
image: ubuntu:22.04

stages:
  - setup
  - build
  - deploy

variables:
  RENV_PATHS_ROOT: /root/.local/share/renv/

cache:
  paths:
    - /root/.cache/R
    - /root/.local/share/renv

before_script:
  - apt-get update && apt-get install -y \
      software-properties-common \
      libcurl4-openssl-dev \
      libxml2-dev \
      libssl-dev \
      libfontconfig1-dev \
      libharfbuzz-dev \
      libfribidi-dev \
      libfreetype6-dev \
      libpng-dev \
      libtiff5-dev \
      libjpeg-dev \
      zlib1g-dev \
      libharfbuzz-bin \
      libfontconfig1 \
      libfreetype6 \
      libfribidi0 \
      libpng16-16 \
      libjpeg62-turbo \
      libtiff5 \
      pandoc \
      git \
      r-base

build:
  stage: build
  script:
    # Checkout Lesson (equivalent to actions/checkout@v4)
    - git clone $CI_REPOSITORY_URL .

    # Set up R (equivalent to r-lib/actions/setup-r@v2)
    - apt-get update && apt-get install -y software-properties-common
    - add-apt-repository -y ppa:cran/libgit2
    - apt-get update && apt-get install -y r-base

    # Set up Pandoc (equivalent to r-lib/actions/setup-pandoc@v2)
    - apt-get update && apt-get install -y pandoc

    # Setup Lesson Engine (equivalent to carpentries/actions/setup-sandpaper@main)
    - Rscript -e 'install.packages("remotes")'
    - Rscript -e 'remotes::install_github("carpentries/sandpaper")'

    # Setup Package Cache (equivalent to carpentries/actions/setup-lesson-deps@main)
    - Rscript -e 'remotes::install_github("carpentries/lesson-dependencies")'

    # Deploy Site (equivalent to sandpaper:::ci_deploy)
    - Rscript -e 'sandpaper::package_cache_trigger(TRUE)'
    - Rscript -e 'sandpaper:::ci_deploy(reset = FALSE)'

# Deploy stage to GitLab Pages
deploy:
  stage: deploy
  script:
    - mv site/ public
  artifacts:
    paths:
      - public
  only:
    - main