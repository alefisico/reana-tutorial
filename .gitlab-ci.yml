# GitLab CI configuration for replicating the sandpaper-main.yaml workflow
image: rocker/r-ver:4.3.0

stages:
  - setup
  - build
  - deploy

variables:
  RENV_PATHS_ROOT: /root/.local/share/renv/

cache:
  paths:
    - /root/.cache/R
    - /root/.local/share/renv

before_script:
  - apt-get update && apt-get install -y pandoc
  - Rscript -e 'install.packages(c("remotes", "sandpaper"))'

setup:
  stage: setup
  script:
    - Rscript -e 'remotes::install_github("carpentries/sandpaper")'

build:
  stage: build
  script:
    - Rscript -e 'sandpaper::package_cache_trigger(TRUE)'

# Deploy stage to GitLab Pages
deploy:
  stage: deploy
  script:
    - mv site/ public
  artifacts:
    paths:
      - public
  only:
    - main